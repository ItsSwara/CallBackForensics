<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Callback Forensics</title>
<style>
  :root {
    --bg: #0e1117; --panel: #151a23; --panel2: #1a2130; --line: #263042; --text: #e8ecf3; --muted: #8e99ad;
    --green: #3ddc84; --red: #ff5d6c; --amber: #ffb84d; --blue: #6aa8ff; --code: #0b0e14;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel2); font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); } .dot.warn { background: var(--amber); } .dot.bad { background: var(--red); }
  .url { font-family: var(--mono); font-size: 13px; color: var(--blue); cursor: pointer; }
  main { flex: 1; display: grid; grid-template-columns: 400px 1fr; min-height: 0; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  #detail { overflow-y: auto; padding: 20px 28px 60px; }
  .row { display: grid; grid-template-columns: 62px 56px 1fr auto; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--panel2); } .row.sel { background: #1d2740; box-shadow: inset 3px 0 0 var(--blue); }
  .row .t { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .row .m { font-weight: 700; font-size: 12px; color: var(--muted); }
  .row .p { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 6px; font-weight: 700; font-size: 13px; font-family: var(--mono); }
  .badge.g { background: rgba(61,220,132,.15); color: var(--green); } .badge.r { background: rgba(255,93,108,.16); color: var(--red); } .badge.n { background: var(--panel2); color: var(--muted); }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 5px; background: rgba(106,168,255,.15); color: var(--blue); margin-left: 6px; }
  .empty { color: var(--muted); padding: 40px 20px; text-align: center; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 26px 0 8px; font-weight: 600; }
  .title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .title .path { font-family: var(--mono); font-size: 20px; word-break: break-all; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); padding: 8px 16px; }
  button:hover:not(:disabled) { border-color: var(--blue); } button:disabled { opacity: .5; cursor: default; }
  button.big { background: var(--blue); color: #08111f; border-color: var(--blue); font-weight: 700; font-size: 17px; padding: 11px 30px; }
  .banner { margin-top: 14px; padding: 14px 18px; border-radius: 10px; font-size: 17px; font-weight: 600; }
  .banner.fixed { background: rgba(61,220,132,.14); border: 1px solid var(--green); color: var(--green); }
  .banner.still { background: rgba(255,93,108,.12); border: 1px solid var(--red); color: var(--red); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; }
  .card.ai { border-color: #34507f; }
  .card .head { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; margin-bottom: 8px; flex-wrap: wrap; }
  .ai-text { white-space: pre-wrap; font-size: 16px; line-height: 1.6; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  ul.findings { margin: 0; padding-left: 20px; } ul.findings li { margin: 4px 0; font-family: var(--mono); font-size: 14px; }
  pre { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 13px/1.5 var(--mono); max-height: 360px; }
  .code .ln { display: block; white-space: pre; } .code .ln.hit { background: rgba(255,93,108,.2); box-shadow: inset 3px 0 0 var(--red); } .code .n { color: var(--muted); display: inline-block; width: 42px; user-select: none; }
  table.h { border-collapse: collapse; width: 100%; font: 13px var(--mono); } table.h td { padding: 3px 10px 3px 0; vertical-align: top; word-break: break-all; } table.h td:first-child { color: var(--muted); white-space: nowrap; }
  details { margin-top: 10px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .note { color: var(--muted); font-size: 14px; } .warn { color: var(--amber); } .err { color: var(--red); } .ok { color: var(--green); }
  .disclaimer { color: var(--muted); font-size: 12px; margin-top: 30px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } #list { max-height: 35vh; border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Callback Forensics</h1>
  <span class="pill" id="relay"><span class="dot"></span><span>relay</span></span>
  <span class="pill" id="ai"><span class="dot"></span><span>AI</span></span>
  <span class="spacer"></span>
  <span class="url" id="pub" title="Click to copy"></span>
</header>
<main>
  <section id="list"><div class="empty">Waiting for callbacks…<br>Send one to your public URL.</div></section>
  <section id="detail"><div class="empty">Select an event on the left.</div></section>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const state = { events: [], sel: null, status: null, detail: null, replayNote: {}, aiStart: {} };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');
  const clock = (t) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const isFail = (e) => e.connectionFailed || (e.status ?? 0) >= 400;
  const badge = (e) => `<span class="badge ${e.status == null ? 'n' : isFail(e) ? 'r' : 'g'}">${e.status ?? '—'}</span>`;

  async function api(path, opts) {
    const r = await fetch(path, opts);
    if (!r.ok) throw new Error(`${path} -> HTTP ${r.status}`);
    return r.json();
  }

  // ---- header ---------------------------------------------------------------
  function renderStatus() {
    const s = state.status; if (!s) return;
    const relay = { connected: ['ok', 'relay connected'], connecting: ['warn', 'relay connecting…'], disconnected: ['bad', 'relay disconnected'], none: ['', 'local only (no tunnel)'] }[s.relay];
    $('#relay').innerHTML = `<span class="dot ${relay[0]}"></span><span>${relay[1]}</span>`;
    $('#ai').innerHTML = s.ai.online ? `<span class="dot ok"></span><span>AI online${s.ai.model ? ' · ' + esc(s.ai.model) : ''}</span>` : `<span class="dot bad"></span><span>AI offline (rule-based only)</span>`;
    const pub = $('#pub'); pub.textContent = s.publicUrl || ''; pub.dataset.url = s.publicUrl || '';
  }
  $('#pub').onclick = () => { const u = $('#pub').dataset.url; if (u) navigator.clipboard?.writeText(u); };

  // ---- list -----------------------------------------------------------------
  function renderList() {
    const el = $('#list');
    if (!state.events.length) { el.innerHTML = '<div class="empty">Waiting for callbacks…<br>Send one to your public URL.</div>'; return; }
    el.innerHTML = state.events.map((e) => `
      <div class="row ${e.id === state.sel ? 'sel' : ''}" data-id="${esc(e.id)}">
        <span class="t">${clock(e.receivedAt)}</span><span class="m">${esc(e.method)}</span>
        <span class="p" title="${esc(e.path)}">${esc(e.path)}${e.replayOf ? '<span class="tag">replay</span>' : ''}</span>${badge(e)}
      </div>`).join('');
    el.querySelectorAll('.row').forEach((r) => (r.onclick = () => select(r.dataset.id)));
  }
  function upsert(ev) {
    const i = state.events.findIndex((e) => e.id === ev.id);
    if (i >= 0) state.events[i] = ev;
    else { state.events.push(ev); state.events.sort((a, b) => b.receivedAt - a.receivedAt); }
    renderList();
    if (ev.id === state.sel) loadDetail(ev.id);
  }

  // ---- detail ---------------------------------------------------------------
  async function select(id) { state.sel = id; renderList(); await loadDetail(id); }
  async function loadDetail(id) {
    try { state.detail = await api('/api/events/' + encodeURIComponent(id)); } catch { return; }
    if (state.sel === id) renderDetail();
  }

  const headersTable = (h) => {
    const rows = Object.entries(h || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(Array.isArray(v) ? v.join(', ') : v)}</td></tr>`).join('');
    return rows ? `<table class="h">${rows}</table>` : '<span class="note">No headers.</span>';
  };
  const bodyBlock = (b) => {
    if (!b || b.size === 0) return '<span class="note">Empty body.</span>';
    if (b.text == null) return `<span class="note">Binary body, ${b.size} bytes (base64 preview below).</span><pre>${esc((b.base64 || '').slice(0, 2000))}</pre>`;
    let t = b.text; try { t = JSON.stringify(JSON.parse(b.text), null, 2); } catch { /* not JSON */ }
    return `<pre>${esc(t)}</pre>${b.truncated ? '<div class="note">Truncated for display.</div>' : ''}`;
  };

  function aiPanel(d, e) {
    const dg = e.diagnosis;
    let body;
    if (!dg) body = '<span class="note">No diagnosis yet.</span>';
    else if (dg.aiPending) {
      if (!state.aiStart[e.id]) state.aiStart[e.id] = Date.now();
      body = `<div style="display:flex;gap:10px;align-items:center"><div class="spinner"></div><span>Local model is reading the evidence… <b id="elapsed">0</b>s</span></div>`;
    } else if (dg.ai && dg.ai.text) {
      delete state.aiStart[e.id];
      body = `<div class="ai-text">${esc(dg.ai.text)}</div>`;
    } else if (dg.ai && dg.ai.error) {
      delete state.aiStart[e.id];
      const skipped = dg.ai.error.kind === 'skipped';
      body = `<div class="${skipped ? 'note' : 'warn'}"><b>${skipped ? 'AI skipped.' : 'AI unavailable, showing rule-based findings.'}</b> ${esc(dg.ai.error.message)}</div>`;
    } else body = '<span class="note">Not analyzed.</span>';
    const meta = dg && dg.ai && dg.ai.text ? `<span>model: ${esc(dg.ai.model)}</span><span>${(dg.ai.ms / 1000).toFixed(1)}s</span>${dg.ai.cached ? '<span class="tag">cached</span>' : ''}` : '';
    return `<div class="card ai"><div class="head"><b>AI explanation (local model)</b>${meta}<span style="flex:1"></span>
      <button id="analyze" ${dg && dg.aiPending ? 'disabled' : ''}>${dg && dg.ai ? 'Re-analyze' : 'Analyze'}</button></div>${body}</div>`;
  }

  function errorPanel(e) {
    const dg = e.diagnosis; if (!dg) return '';
    let html = '';
    if (dg.errorMessage) html += `<div class="err" style="font-family:var(--mono);margin-bottom:8px">${esc(dg.errorMessage)}</div>`;
    if (dg.frame) html += `<div class="note" style="margin-bottom:8px">at ${esc(dg.frame.fn || '(anonymous)')} · ${esc(dg.frame.relPath || dg.frame.file)}:${dg.frame.line}:${dg.frame.col}</div>`;
    if (dg.snippet && dg.snippet.ok) {
      html += `<pre class="code">${dg.snippet.lines.map((l) => `<span class="ln ${l.highlight ? 'hit' : ''}"><span class="n">${l.n}</span>${esc(l.text)}</span>`).join('')}</pre>`;
    } else if (dg.snippet) html += `<div class="note warn">Source not shown: ${esc(dg.snippet.message)}</div>`;
    if (e.stderrWindow) html += `<details open><summary>stderr captured during this request</summary><pre>${esc(e.stderrWindow)}</pre></details>`;
    if (!dg.hasAppProcess && !e.stderrWindow) html += `<div class="note">No stack trace: the CLI was started without an app command (<code>cbf start -- &lt;your command&gt;</code>), so it cannot see your app's stderr.</div>`;
    else if (!dg.errorMessage && !e.stderrWindow) html += `<div class="note">No error output was captured while this request ran.</div>`;
    return html;
  }

  function renderDetail() {
    const e = state.detail; if (!e) return;
    const fail = isFail(e);
    const note = state.replayNote[e.id];
    const dg = e.diagnosis;
    const q = e.query ? '?' + e.query : '';
    let html = `
      <div class="title">${badge(e)}<span class="path"><b>${esc(e.method)}</b> ${esc(e.path)}${esc(q)}</span></div>
      <div class="meta">${new Date(e.receivedAt).toLocaleString()} · ${e.durationMs ?? '—'} ms${e.replayOf ? ` · replay of <a href="#" id="origlink" style="color:var(--blue)">${esc(e.replayOf.slice(0, 8))}</a>` : ''}</div>
      <div class="actions"><button class="big" id="replay">▶ Replay</button><button id="curl">Copy as curl</button></div>`;
    if (note) html += `<div class="banner ${note.flipped ? 'fixed' : note.status >= 400 ? 'still' : ''}">${note.flipped ? `Fixed! ${note.from} → ${note.status}` : `Replay returned ${note.status} (was ${note.from})`}</div>`;
    if (fail) {
      html += `<h2>Diagnosis</h2>${aiPanel(dg, e)}`;
      html += `<h2>Rule-based findings (instant)</h2><div class="card">${dg && dg.ruleBased && dg.ruleBased.length ? `<ul class="findings">${dg.ruleBased.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>` : '<span class="note">Computing…</span>'}</div>`;
      html += `<h2>Error</h2><div class="card">${errorPanel(e) || '<span class="note">Computing…</span>'}</div>`;
    } else {
      html += `<h2>Diagnosis</h2><div class="card"><span class="ok">This callback succeeded.</span> <span class="note">Diagnosis runs automatically for 4xx/5xx responses and connection failures.</span></div>`;
    }
    html += `<h2>Request</h2><div class="card">${bodyBlock(e.requestBody)}<details><summary>Headers</summary>${headersTable(e.requestHeaders)}</details></div>`;
    html += `<h2>Response</h2><div class="card">${bodyBlock(e.responseBody)}<details><summary>Headers</summary>${headersTable(e.responseHeaders)}</details></div>`;
    html += `<div class="disclaimer">AI analysis runs locally on your machine. The relay stores events for 24h with token auth. Small local models can be wrong: check the rule-based findings and the code.</div>`;
    $('#detail').innerHTML = html;
    $('#replay').onclick = replay;
    $('#curl').onclick = copyCurl;
    const a = $('#analyze'); if (a) a.onclick = () => analyze(true);
    const ol = $('#origlink'); if (ol) ol.onclick = (ev) => { ev.preventDefault(); select(e.replayOf); };
  }

  async function replay() {
    const e = state.detail; const btn = $('#replay'); btn.disabled = true; btn.textContent = 'Replaying…';
    try {
      const r = await api('/api/replay/' + encodeURIComponent(e.id), { method: 'POST' });
      state.replayNote[e.id] = { status: r.event.status, from: r.originalStatus, flipped: r.flipped };
    } catch (err) { state.replayNote[e.id] = { status: 'error', from: e.status, flipped: false }; }
    renderDetail();
  }
  async function analyze(force) {
    const e = state.detail;
    state.aiStart[e.id] = Date.now();
    try { await api('/api/analyze/' + encodeURIComponent(e.id) + (force ? '?force=1' : ''), { method: 'POST' }); } catch { /* ignore */ }
  }
  function copyCurl() {
    const e = state.detail; const s = state.status;
    const q = (x) => `'${String(x).replace(/'/g, `'\\''`)}'`;
    const skip = new Set(['host', 'content-length', 'connection', 'transfer-encoding', 'keep-alive']);
    let cmd = `curl -X ${e.method} ${q(`http://localhost:${s ? s.appPort : 3000}${e.path}${e.query ? '?' + e.query : ''}`)}`;
    for (const [k, v] of Object.entries(e.requestHeaders || {})) if (!skip.has(k.toLowerCase())) cmd += ` \\\n  -H ${q(k + ': ' + (Array.isArray(v) ? v.join(', ') : v))}`;
    if (e.requestBody && e.requestBody.text) cmd += ` \\\n  --data-binary ${q(e.requestBody.text)}`;
    navigator.clipboard?.writeText(cmd);
    const b = $('#curl'); b.textContent = 'Copied!'; setTimeout(() => (b.textContent = 'Copy as curl'), 1200);
  }

  setInterval(() => {
    const el = $('#elapsed'); const st = state.sel && state.aiStart[state.sel];
    if (el && st) el.textContent = Math.floor((Date.now() - st) / 1000);
  }, 500);

  // ---- boot -----------------------------------------------------------------
  async function boot() {
    try { state.status = await api('/api/status'); renderStatus(); } catch { /* retry via SSE */ }
    try { state.events = await api('/api/events'); renderList(); if (state.events[0]) select(state.events[0].id); } catch { /* ignore */ }
    const es = new EventSource('/api/stream');
    es.onmessage = (m) => {
      const msg = JSON.parse(m.data);
      if (msg.type === 'status') { state.status = msg.status; renderStatus(); }
      else if (msg.type === 'event') {
        const isNew = !state.events.some((e) => e.id === msg.event.id);
        upsert(msg.event);
        if (isNew && !state.sel) select(msg.event.id);
      }
    };
  }
  boot();
})();
</script>
</body>
</html>
